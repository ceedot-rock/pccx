[package]
name = "pccx"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "PCCX closed crate. Pulsar + Combined GC in-tree. PCC1 frame."

[[bin]]
name = "pccx"
path = "src/bin/pccx.rs"

[profile.release]
lto = "thin"
opt-level = 3

[dependencies]
pulsar = { path = "vendor/pulsar" }
combined-gc = { path = "vendor/combined-gc" }
